name: Build Relic Cam iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate Xcode project
        run: python3 ios/Silverphase/Tools/gen-project.py
      - name: Archive (device, unsigned)
        run: |
          xcodebuild -project ios/Silverphase/Silverphase.xcodeproj \
            -scheme Silverphase -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/RelicCam.xcarchive" \
            CODE_SIGNING_ALLOWED=NO SILVERPHASE_LOCAL_MATERIALS=0 \
            archive
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/RelicCam.xcarchive/Products/Applications/Silverphase.app Payload/
          zip -qry RelicCam.ipa Payload
          ls -lh RelicCam.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: RelicCam-IPA
          path: RelicCam.ipa
          if-no-files-found: error

      - name: Publish IPA to build-ipa branch
        run: |
          git config user.name "RelicCam CI"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B build-ipa
          cp RelicCam.ipa RelicCam-unsigned.ipa
          git add -f RelicCam-unsigned.ipa
          git commit -m "build: unsigned Relic Cam IPA" || echo "no changes to commit"
          git push -f origin build-ipa
